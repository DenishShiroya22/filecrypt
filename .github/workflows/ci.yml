name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Unit, CLI, bounded-memory and 100-cycle stress tests
        run: |
          ctest --test-dir build --output-on-failure
          bash tests/cli.sh ./build/filecrypt
          bash tests/memory_bound.sh ./build/filecrypt
          bash test.sh ./build/filecrypt
  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitizer
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFILECRYPT_${{ matrix.sanitizer }}=ON
          cmake --build build --parallel 2
      - name: Unit and full stress tests
        run: |
          if [ "${{ matrix.sanitizer }}" = TSAN ]; then
            # Per-process ASLR setting avoids old TSan/kernel mapping conflicts.
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure
            setarch "$(uname -m)" -R bash test.sh ./build/filecrypt
          else
            ctest --test-dir build --output-on-failure
            bash test.sh ./build/filecrypt
          fi
